name: Employee Benefits Actuarial CI

on:
  push:
    paths:
      - "workforce-solutions-actuarial-analytics/**"
      - ".github/workflows/employee-benefits-actuarial-ci.yml"
  pull_request:
    paths:
      - "workforce-solutions-actuarial-analytics/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workforce-solutions-actuarial-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: workforce-solutions-actuarial-analytics/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.model
      - run: python -m src.build_excel
      - uses: actions/upload-artifact@v4
        with:
          name: Employee_Benefits_Actuarial_Model
          path: workforce-solutions-actuarial-analytics/Employee_Benefits_Actuarial_Model.xlsx
          if-no-files-found: error
